# Makes the pictures used in README.md and saves them to a branch called "output":
#   - the "snake eating my contributions" animation
#   - the stats, top-languages and streak cards, drawn by .github/scripts/make_cards.py
#     from GitHub data (free card services block GitHub's servers)
# Runs every day, on every push to main, and when started by hand (Actions tab -> Run workflow).
name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # gets .github/scripts/make_cards.py (must run first: it clears the folder)

      # Runs BEFORE the snake: the snake step runs in Docker as "root" and would
      # create dist/ as a folder this step isn't allowed to write into.
      - name: Draw stats cards
        run: python .github/scripts/make_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_USER: ${{ github.repository_owner }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2bd6&color_dots=#161b22,#3b2a5e,#6b3fa0,#a64fd6,#ff2bd6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
